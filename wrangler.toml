name = "hadekost"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./pub"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hadekost-db"
database_id = "3752c0b8-47a0-4990-b7e4-a1cec2695d69"
migrations_dir = "db"

[vars]
COOKIE_SECURE = "true"

# Foto KTP penyewa: berkas biner di R2 (bukan D1 — D1 membatasi baris ~2 MB).
# Bucket hadekost-ktp harus dibuat lebih dulu lewat dashboard Cloudflare
# (R2 > Create bucket). Bila bucket tidak ada, `wrangler deploy` DITOLAK dengan
# "R2 bucket not found" (kode 10085) — itu benar, jangan hapus binding ini diam-diam:
# menghapusnya membuat produksi kembali menyimpan foto ke D1 tanpa terlihat.
#
# Foto lama di tabel ktp_berkas (D1) tidak ikut pindah; unggah ulang foto yang perlu.
[[r2_buckets]]
binding = "KTP"
bucket_name = "hadekost-ktp"
