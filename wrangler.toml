name = "hadekost"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./pub"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hadekost-db"
database_id = "3752c0b8-47a0-4990-b7e4-a1cec2695d69"
migrations_dir = "db"

[vars]
COOKIE_SECURE = "true"

# Foto KTP penyewa (berkas biner TIDAK ditaruh di D1)
# Aktifkan blok ini setelah bucket dibuat:
#   npx wrangler r2 bucket create hadekost-ktp      (butuh token dengan izin Workers R2 Storage)
# lalu set KTP_MODE = 'r2' di worker/logic.js.
# [[r2_buckets]]
# binding = "KTP"
# bucket_name = "hadekost-ktp"
